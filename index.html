<body>
  <!-- ...existing content... -->
  <canvas id="c"></canvas>

  <div id="ui">
    <div class="toolbar" role="toolbar" aria-label="Terrain editor controls">
      <div id="sliders" class="sliders-row">
        <label class="slider">
          <span>Strength</span>
          <input id="brush-strength" type="range" min="1" max="100" value="35" />
        </label>
        <label id="size-slider" class="slider">
          <span>Size</span>
          <input id="brush-size" type="range" min="1" max="40" value="12" step="1" />
        </label>
      </div>
      <div class="buttons-row">
        <button id="mode-navigate" class="btn active" aria-pressed="true" aria-label="Navigate" title="Navigate">
          <!-- hand cursor icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V6a1 1 0 0 1 2 0v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 11V5a1 1 0 0 1 2 0v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 11V4a1 1 0 0 1 2 0v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13 11V6a1 1 0 0 1 2 0v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 11l-1.2 1.6a2 2 0 0 0-.4 1.2V16a6 6 0 0 0 6 6h2a6 6 0 0 0 6-6v-2.5a1.5 1.5 0 0 0-3 0V11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="mode-raise" class="btn" aria-pressed="false" aria-label="Raise terrain" title="Raise">
          <!-- arrow up icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="mode-lower" class="btn" aria-pressed="false" aria-label="Lower terrain" title="Lower">
          <!-- arrow down icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 13l-6 6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="toggle-grid" class="btn" aria-pressed="false" aria-label="Toggle grid" title="Toggle grid">
          <!-- grid icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <div class="spacer"></div>
      </div>
    </div>
    <button id="toggle-ui" aria-label="Toggle controls" aria-expanded="true" title="Show/Hide controls">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5 0 9.27 3.11 11 7-1.73 3.89-6 7-11 7S2.73 15.89 1 12C2.73 8.11 7 5 12 5zm0 3.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5z" fill="currentColor"/></svg>
    </button>
  </div>

  <script type="module" src="./main.js"></script>
